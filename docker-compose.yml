services:

  web:
    build: ./php
    container_name: dellien_web

    ports:
      - "80:80"

    volumes:
      - ./Proyecto:/var/www/proyecto
      - ./apache/default.conf:/etc/apache2/sites-available/000-default.conf

    depends_on:
      - db

  db:
    image: mariadb:11
    container_name: dellien_db

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: crm_daw

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: dellien_phpmyadmin

    restart: always

    ports:
      - "8080:80"

    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root

    depends_on:
      - db

volumes:
  mysql_data: